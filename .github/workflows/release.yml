name: Release

# Bump <Version> in src/AltSpacy/AltSpacy.csproj and add the matching ReleaseNotes entry (SmartInput.cs), merge, then:
#   git tag v1.5.0 && git push origin v1.5.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the app version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-Xml -Path src/AltSpacy/AltSpacy.csproj -XPath '//Version').Node.InnerText
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match <Version>$version</Version> in AltSpacy.csproj." }

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = @((Get-ChildItem dist/release -Filter *.exe).FullName) + (Resolve-Path dist/release/SHA256SUMS.txt).Path
          gh release create $env:TAG @assets --verify-tag --title "AltSpacy $($env:TAG.TrimStart('v'))" --notes-file dist/release/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }
