name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Runs the tests (window tests open real WPF windows off-screen), publishes both exes and smoke-starts them.
      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Upload downloads
        uses: actions/upload-artifact@v5
        with:
          name: altspacy-${{ github.sha }}
          path: dist/release/
          retention-days: 14
